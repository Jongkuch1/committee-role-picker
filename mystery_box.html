<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Mystery Box Selector</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #111827;
        }

        /* Sign In Screen Styles */
        #login-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Game Screen Styles */
        #game-screen {
            display: none;
        }

        .user-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .box {
            background: #3b82f6;
            color: white;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, background 0.2s, opacity 0.5s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .box:hover {
            transform: translateY(-3px);
            background: #2563eb;
        }

        .box-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        /* Result Screen Styles */
        #result-screen {
            display: none;
        }

        .reveal-card {
            background: #f0fdf4;
            border: 2px dashed #22c55e;
            padding: 25px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .role-text {
            font-size: 28px;
            font-weight: 800;
            color: #16a34a;
            margin-top: 10px;
        }

        .error-message {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. SIGN IN SCREEN -->
    <div id="login-screen">
        <h1>Sign In to Pick a Box</h1>
        <div id="login-error" class="error-message"></div>
        <input type="text" id="username-input" placeholder="Enter your full name" required>
        <button onclick="handleSignIn()">Sign In</button>
    </div>

    <!-- 2. MAIN GAME SCREEN -->
    <div id="game-screen">
        <h1>Select Exactly One Mystery Box</h1>
        <div id="user-display" class="user-badge"></div>
        <p style="color: #6b7280; font-size: 14px;">Once you click a box, your choice is final and the box will be removed.</p>
        <div id="box-grid" class="grid"></div>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="result-screen">
        <h1>Selection Confirmed!</h1>
        <div class="reveal-card">
            <p>Thank you for participating. You have drawn:</p>
            <div id="revealed-role" class="role-text"></div>
        </div>
        <p style="color: #6b7280; font-size: 14px;">Your response has been locked. You cannot pick another box.</p>
    </div>
</div>

<script>
    // Pre-loaded roles as requested
    const rolesPool = [
        "Secretary General",
        "Organizing Secretary",
        "Member",
        "Member"
    ];

    let currentUser = null;

    // Helper function to shuffle array items uniformly
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Initialize or retrieve game configuration
    // Uses localStorage so state is maintained locally even on page refresh
    if (!localStorage.getItem('shuffledRoles')) {
        localStorage.setItem('shuffledRoles', JSON.stringify(shuffle([...rolesPool])));
    }
    if (!localStorage.getItem('historyLog')) {
        localStorage.setItem('historyLog', JSON.stringify({}));
    }

    // Check if the user has already picked previously upon opening page
    window.onload = function() {
        const activeUser = localStorage.getItem('activeUser');
        if (activeUser) {
            currentUser = activeUser;
            checkUserGameStatus();
        }
    };

    function handleSignIn() {
        const input = document.getElementById('username-input').value.trim();
        const errorDiv = document.getElementById('login-error');

        if (input === "") {
            errorDiv.textContent = "Please enter a valid name to continue.";
            errorDiv.style.display = "block";
            return;
        }

        currentUser = input;
        localStorage.setItem('activeUser', currentUser);
        errorDiv.style.display = "none";

        checkUserGameStatus();
    }

    function checkUserGameStatus() {
        document.getElementById('login-screen').style.display = 'none';
        const historyLog = JSON.parse(localStorage.getItem('historyLog'));

        // Strict Enforcement: If user already has a logged selection, force the result screen
        if (historyLog[currentUser]) {
            showResult(historyLog[currentUser]);
        } else {
            showGame();
        }
    }

    function showGame() {
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('user-display').textContent = `Logged in as: ${currentUser}`;
        renderBoxes();
    }

    function renderBoxes() {
        const grid = document.getElementById('box-grid');
        grid.innerHTML = '';

        const currentRoles = JSON.parse(localStorage.getItem('shuffledRoles'));

        currentRoles.forEach((role, index) => {
            // Only render boxes that haven't been picked (indicated by null)
            if (role !== null) {
                const boxElement = document.createElement('div');
                boxElement.className = 'box';
                boxElement.innerHTML = `<span class="box-icon">🎁</span>Box ${index + 1}`;
                boxElement.onclick = () => selectBox(index);
                grid.appendChild(boxElement);
            }
        });

        // Fallback check if all boxes have been exhausted
        if (grid.children.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; color: #dc2626; font-weight: 600;">All mystery boxes have already been claimed!</p>';
        }
    }

    function selectBox(index) {
        const historyLog = JSON.parse(localStorage.getItem('historyLog'));

        // Double-check lockout status right at click time
        if (historyLog[currentUser]) {
            alert("Security Lock: You have already picked a box!");
            window.location.reload();
            return;
        }

        let currentRoles = JSON.parse(localStorage.getItem('shuffledRoles'));
        const chosenRole = currentRoles[index];

        // 1. Assign item to the active user profile
        historyLog[currentUser] = chosenRole;
        localStorage.setItem('historyLog', JSON.stringify(historyLog));

        // 2. Automatic Elimination: Remove item completely from the active index array
        currentRoles[index] = null;
        localStorage.setItem('shuffledRoles', JSON.stringify(currentRoles));

        // 3. Move UI to confirmation view
        showResult(chosenRole);
    }

    function showResult(role) {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('revealed-role').textContent = role;
    }
</script>

</body>
</html>
